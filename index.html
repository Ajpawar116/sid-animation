<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointillism Lily</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: rgb(4, 2, 10);
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, scale;
let gx, gy, HS;

const BG = [4, 2, 10];

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;

    ctx.setTransform(devicePixelRatio, 0, 0,
                     devicePixelRatio, 0, 0);

    scale = Math.min(W / 720, H / 1280);

    gx = W / 2;
    gy = H * 0.82;
    HS = 380 * scale;
}

window.addEventListener("resize", resize);
resize();


// ----------------------------------------------------
// Random helpers
// ----------------------------------------------------

function rand(min = 0, max = 1) {
    return min + Math.random() * (max - min);
}

function lerp(a, b, t) {
    return a + (b - a) * t;
}

function smooth(x) {
    x = Math.max(0, Math.min(1, x));
    return x * x * (3 - 2 * x);
}


// ----------------------------------------------------
// Midrib
// Same basic idea as Python midrib()
// ----------------------------------------------------

function midrib(L, a0, curl, K = 40) {

    let r = new Array(K + 1);
    let h = new Array(K + 1);

    r[0] = 0;
    h[0] = 0;

    let ds = L / K;

    for (let i = 1; i <= K; i++) {

        let u = i / K;
        let a = a0 + curl * Math.pow(u, 1.6);

        r[i] = r[i - 1] + Math.sin(a) * ds;
        h[i] = h[i - 1] + Math.cos(a) * ds;
    }

    return { r, h };
}


// ----------------------------------------------------
// Particle storage
// ----------------------------------------------------

const petals = [];
const leaves = [];
const stemParticles = [];
const groundParticles = [];
const dust = [];
const floating = [];


// ----------------------------------------------------
// Ground
// ----------------------------------------------------

for (let i = 0; i < 2200; i++) {

    let x = rand(-340, 340) * scale;

    let mound =
        (1 - Math.pow(x / (340 * scale), 2))
        * 55 * scale;

    let y =
        gy -
        mound * Math.sqrt(Math.random()) +
        rand(-1.5, 1.5);

    groundParticles.push({
        x: gx + x,
        y: y,
        r: rand(0.4, 1.3),
        color: [
            rand(70, 140),
            rand(55, 100),
            rand(80, 120)
        ]
    });
}


// ----------------------------------------------------
// Falling / background particles
// ----------------------------------------------------

for (let i = 0; i < 250; i++) {

    dust.push({
        x: rand(0, W),
        y: rand(0, H),
        speed: rand(6, 22) * scale,
        phase: rand(0, Math.PI * 2),
        frequency: rand(1, 4),
        size: rand(0.4, 1.5)
    });
}


// ----------------------------------------------------
// Stem particles
// ----------------------------------------------------

for (let i = 0; i < 1500; i++) {

    let s = Math.random();

    stemParticles.push({
        s: s,
        dx: rand(-1, 1) * 3.2 * scale,
        r: rand(40, 120),
        g: rand(150, 215),
        b: rand(95, 120),
        size: rand(0.4, 1.3)
    });
}


// ----------------------------------------------------
// Leaves
// ----------------------------------------------------

const leafData = [
    [0.10, 190, 1],
    [0.24, 175, -1],
    [0.40, 150, 1],
    [0.56, 120, -1]
];

for (const [s0, Lf, side] of leafData) {

    let particles = [];

    for (let i = 0; i < 650; i++) {

        let u = Math.pow(Math.random(), 0.9);
        let v = rand(-1, 1);

        let prof =
            Math.pow(
                Math.sin(Math.PI * Math.pow(u, 0.8)),
                0.8
            );

        let c = {
            r: lerp(40, 140, u),
            g: lerp(160, 235, u),
            b: lerp(100, 140, u)
        };

        if (Math.abs(v) < 0.08) {
            c = {r: 190, g: 240, b: 170};
        }

        particles.push({
            u,
            v,
            prof,
            color: c
        });
    }

    leaves.push({
        s0,
        L: Lf * scale,
        side,
        particles
    });
}


// ----------------------------------------------------
// Lily petals
// ----------------------------------------------------

const PETAL_COUNT = 6;

for (let k = 0; k < PETAL_COUNT; k++) {

    let outer = k % 2 === 0;

    let particles = [];

    for (let i = 0; i < 1100; i++) {

        let pu = Math.pow(Math.random(), 0.85);
        let pv = rand(-1, 1);

        let prof =
            Math.pow(
                Math.sin(
                    Math.PI * Math.pow(pu, 0.7)
                ),
                0.9
            );

        let stops = [0, 0.35, 0.7, 1];

        let baseR = interpolateStops(
            pu,
            stops,
            [205, 255, 255, 255]
        );

        let baseG = interpolateStops(
            pu,
            stops,
            [40, 95, 150, 195]
        );

        let baseB = interpolateStops(
            pu,
            stops,
            [125, 165, 205, 228]
        );

        let color = {
            r: baseR,
            g: baseG,
            b: baseB
        };


        // Yellow central area
        let mid =
            Math.abs(pv) < 0.07 &&
            pu < 0.55;

        if (mid) {
            color = {
                r: 235,
                g: 225,
                b: 150
            };
        }


        // Dark pink spots
        let spot =
            Math.random() < 0.10 &&
            pu < 0.6 &&
            Math.abs(pv) < 0.75 &&
            !mid;

        if (spot) {
            color = {
                r: 140,
                g: 15,
                b: 80
            };
        }


        // Edge brightness
        if (Math.abs(pv) > 0.88) {
            color.r *= 1.08;
            color.g *= 1.08;
            color.b *= 1.08;
        }


        let brightness = 0.82 + 0.35 * Math.random();

        color.r *= brightness;
        color.g *= brightness;
        color.b *= brightness;

        particles.push({
            u: pu,
            v: pv,
            prof,
            color
        });
    }

    petals.push({
        phi: (k * 60 + 8) * Math.PI / 180,
        L: (outer ? 300 : 280) * scale,
        W: (outer ? 64 : 72) * scale,
        ac: outer ? 0.10 : 0.05,
        ao: outer ? 1.05 : 0.82,
        curl: outer ? 0.95 : 0.75,
        particles
    });
}


// ----------------------------------------------------
// Flower ring particles
// ----------------------------------------------------

let ring = [];

for (let i = 0; i < 800; i++) {
    ring.push(rand(0, Math.PI * 2));
}


// ----------------------------------------------------
// Stem position
// ----------------------------------------------------

function stemX(s, t) {

    let sway =
        10 * scale * Math.sin(0.9 * t);

    return gx +
        30 * scale * Math.sin(2.2 * s) +
        sway * s * s;
}

function stemY(s) {
    return gy - s * HS;
}


// ----------------------------------------------------
// Interpolation helper
// ----------------------------------------------------

function interpolateStops(x, stops, values) {

    for (let i = 0; i < stops.length - 1; i++) {

        if (x >= stops[i] && x <= stops[i + 1]) {

            let t =
                (x - stops[i]) /
                (stops[i + 1] - stops[i]);

            return lerp(
                values[i],
                values[i + 1],
                t
            );
        }
    }

    return values[values.length - 1];
}


// ----------------------------------------------------
// Draw point
// ----------------------------------------------------

function point(x, y, size, color, alpha = 1) {

    ctx.fillStyle =
        `rgba(${color.r},${color.g},${color.b},${alpha})`;

    ctx.fillRect(
        x,
        y,
        size,
        size
    );
}


// ----------------------------------------------------
// Render
// ----------------------------------------------------

function render(t) {

    ctx.fillStyle =
        `rgb(${BG[0]},${BG[1]},${BG[2]})`;

    ctx.fillRect(0, 0, W, H);


    // -----------------------------------------------
    // Background falling particles
    // -----------------------------------------------

    for (const d of dust) {

        let yy =
            (d.y + t * d.speed) % H;

        let twinkle =
            0.35 +
            0.35 *
            Math.sin(
                t * d.frequency +
                d.phase
            );

        point(
            d.x,
            yy,
            d.size * scale,
            {
                r: 255,
                g: 200,
                b: 235
            },
            twinkle
        );
    }


    // -----------------------------------------------
    // Stem growth
    // -----------------------------------------------

    let g = smooth(t / 4.0);

    for (const p of stemParticles) {

        if (p.s <= g) {

            point(
                stemX(p.s, t) + p.dx,
                stemY(p.s),
                p.size * scale,
                {
                    r: p.r,
                    g: p.g,
                    b: p.b
                },
                1
            );
        }
    }


    // -----------------------------------------------
    // Stem line
    // -----------------------------------------------

    ctx.beginPath();

    ctx.moveTo(
        stemX(0, t),
        stemY(0)
    );

    ctx.lineTo(
        stemX(1, t),
        stemY(1)
    );

    ctx.strokeStyle =
        "rgba(50,150,90,0.22)";

    ctx.lineWidth =
        1.5 * scale;

    ctx.stroke();


    // -----------------------------------------------
    // Leaves
    // -----------------------------------------------

    for (const leaf of leaves) {

        let lg =
            Math.max(
                0,
                Math.min(
                    1,
                    (g - leaf.s0) * 2.5
                )
            );

        if (lg <= 0.01)
            continue;

        let L =
            leaf.L * lg;

        let curve =
            midrib(
                L,
                0.85,
                1.1
            );

        for (const p of leaf.particles) {

            let rr =
                interpolateArray(
                    p.u,
                    curve.r
                );

            let hh =
                interpolateArray(
                    p.u,
                    curve.h
                );

            let width =
                15 *
                scale *
                p.prof *
                lg;

            let bx =
                stemX(
                    leaf.s0,
                    t
                );

            let by =
                stemY(
                    leaf.s0
                );

            let sway =
                Math.sin(
                    t * 1.2 +
                    leaf.s0 * 5
                ) * 0.03;

            let x =
                bx +
                leaf.side *
                (
                    rr +
                    p.v *
                    width *
                    0.35
                ) +
                sway *
                hh *
                leaf.side;

            let y =
                by -
                hh +
                p.v *
                width;

            point(
                x,
                y,
                1.4 * scale,
                p.color,
                0.9
            );
        }
    }


    // -----------------------------------------------
    // Flower opening
    // -----------------------------------------------

    let e =
        smooth(
            (t - 5) /
            (15 - 5)
        );

    let rev =
        smooth(
            (t - 4 + 0.3) /
            1.6
        );

    if (rev > 0.01) {

        let hx =
            stemX(1, t);

        let hy =
            stemY(1);


        // -------------------------------------------
        // Pink particle ring
        // -------------------------------------------

        if (e > 0.01) {

            let alpha =
                smooth(
                    (t - 6.5) /
                    4
                ) * 0.7;

            let R =
                300 * scale;

            let cy =
                hy -
                90 * scale;

            for (let i = 0; i < ring.length; i++) {

                let a =
                    ring[i] +
                    t * 0.12;

                point(
                    hx + R * Math.cos(a),
                    cy + R * Math.sin(a),
                    1.1 * scale,
                    {
                        r: 255,
                        g: 190,
                        b: 225
                    },
                    alpha
                );
            }
        }


        // -------------------------------------------
        // Six petals
        // -------------------------------------------

        for (const petal of petals) {

            let Ls =
                petal.L *
                (0.45 + 0.55 * e) *
                (0.35 + 0.65 * rev);

            let a0 =
                lerp(
                    petal.ac,
                    petal.ao,
                    e
                );

            let curl =
                (0.12 + 0.88 * e) *
                petal.curl;

            let curve =
                midrib(
                    Ls,
                    a0,
                    curl
                );

            let cp =
                Math.cos(
                    0.25 + t * 0.22
                );

            let sp =
                Math.sin(
                    0.25 + t * 0.22
                );

            let ct =
                Math.cos(0.5);

            let st =
                Math.sin(0.5);

            for (const p of petal.particles) {

                if (p.u > rev)
                    continue;

                let rr =
                    interpolateArray(
                        p.u,
                        curve.r
                    );

                let hh =
                    interpolateArray(
                        p.u,
                        curve.h
                    );

                let wid =
                    petal.W *
                    (0.55 + 0.45 * e) *
                    p.prof *
                    (0.35 + 0.65 * rev);

                let ph =
                    petal.phi;

                let X =
                    rr * Math.cos(ph) -
                    p.v *
                    wid *
                    Math.sin(ph);

                let Z =
                    rr * Math.sin(ph) +
                    p.v *
                    wid *
                    Math.cos(ph);

                let Y =
                    hh +
                    p.v *
                    p.v *
                    wid *
                    (
                        0.30 *
                        (1 - e) -
                        0.25 *
                        e
                    );

                let Xp =
                    X * cp +
                    Z * sp;

                let Zp =
                    -X * sp +
                    Z * cp;

                let sy =
                    Y * ct -
                    Zp * st;

                let shade =
                    0.55 +
                    0.45 *
                    Math.max(
                        0,
                        Math.min(
                            1,
                            Zp /
                            petal.L *
                            0.8 +
                            0.5
                        )
                    );

                let c = {
                    r: p.color.r,
                    g: p.color.g,
                    b: p.color.b
                };


                // Green tint while opening
                let tint =
                    (1 - e) *
                    Math.min(
                        1,
                        p.u * 1.3
                    ) *
                    0.6;

                c.r =
                    c.r * (1 - tint) +
                    135 * tint;

                c.g =
                    c.g * (1 - tint) +
                    205 * tint;

                c.b =
                    c.b * (1 - tint) +
                    125 * tint;


                point(
                    hx + Xp +
                    Math.sin(t * 0.8) *
                    0.02 *
                    sy,

                    hy - sy,

                    1.35 * scale,

                    {
                        r: c.r * shade,
                        g: c.g * shade,
                        b: c.b * shade
                    },

                    0.95
                );
            }
        }


        // -------------------------------------------
        // Yellow stamens
        // -------------------------------------------

        if (e > 0.28) {

            let sr =
                smooth(
                    (e - 0.28) /
                    0.4
                );

            for (let k = 0; k < 6; k++) {

                let phi =
                    (k * 60 + 38) *
                    Math.PI / 180;

                let Ls =
                    215 *
                    scale *
                    (0.4 + 0.6 * e) *
                    sr;

                let curve =
                    midrib(
                        Ls,
                        lerp(
                            0.15,
                            0.62,
                            e
                        ),
                        0.55 * e
                    );

                for (let j = 0; j < 30; j++) {

                    let u =
                        Math.random();

                    let rr =
                        interpolateArray(
                            u,
                            curve.r
                        );

                    let hh =
                        interpolateArray(
                            u,
                            curve.h
                        );

                    let X =
                        rr *
                        Math.cos(phi);

                    let Z =
                        rr *
                        Math.sin(phi);

                    let Y =
                        hh;

                    let cp =
                        Math.cos(
                            0.25 +
                            t * 0.22
                        );

                    let sp =
                        Math.sin(
                            0.25 +
                            t * 0.22
                        );

                    let Xp =
                        X * cp +
                        Z * sp;

                    let Zp =
                        -X * sp +
                        Z * cp;

                    let sy =
                        Y *
                        Math.cos(0.5) -
                        Zp *
                        Math.sin(0.5);

                    point(
                        hx + Xp,
                        hy - sy,
                        1.5 * scale,
                        {
                            r: 245,
                            g: 235,
                            b: 200
                        },
                        0.9
                    );
                }


                // Orange tip
                let tipR =
                    curve.r[curve.r.length - 1];

                let tipH =
                    curve.h[curve.h.length - 1];

                let tx =
                    tipR *
                    Math.cos(phi);

                let tz =
                    tipR *
                    Math.sin(phi);

                let cp =
                    Math.cos(
                        0.25 +
                        t * 0.22
                    );

                let sp =
                    Math.sin(
                        0.25 +
                        t * 0.22
                    );

                let txp =
                    tx * cp +
                    tz * sp;

                let tzp =
                    -tx * sp +
                    tz * cp;

                let tsy =
                    tipH *
                    Math.cos(0.5) -
                    tzp *
                    Math.sin(0.5);

                for (let j = 0; j < 18; j++) {

                    point(
                        hx + txp +
                        rand(-2, 2) * scale,

                        hy - tsy +
                        rand(-1, 1) * scale,

                        1.7 * scale,

                        {
                            r: 255,
                            g: 150,
                            b: 40
                        },
                        0.9
                    );
                }
            }
        }
    }


    // -----------------------------------------------
    // Floating pink/yellow particles
    // -----------------------------------------------

    if (e > 0.6) {

        let fa =
            smooth(
                (e - 0.6) /
                0.4
            );

        let hx =
            stemX(1, t);

        let hy =
            stemY(1);

        for (let i = 0; i < 80; i++) {

            let q =
                (t * 0.08 +
                i / 80) % 1;

            let x =
                hx +
                rand(-80, 80) *
                scale *
                q;

            let y =
                hy -
                110 * scale +
                q *
                (gy -
                hy +
                90 * scale);

            let alpha =
                (1 - q) *
                fa;

            let yellow =
                i % 3 === 0;

            point(
                x,
                y,
                1.5 * scale,
                yellow ?
                {
                    r: 255,
                    g: 190,
                    b: 80
                } :
                {
                    r: 255,
                    g: 150,
                    b: 205
                },
                alpha
            );
        }
    }
}


// ----------------------------------------------------
// Array interpolation
// ----------------------------------------------------

function interpolateArray(u, arr) {

    let p =
        u * (arr.length - 1);

    let i =
        Math.floor(p);

    let f =
        p - i;

    if (i >= arr.length - 1)
        return arr[arr.length - 1];

    return lerp(
        arr[i],
        arr[i + 1],
        f
    );
}


// ----------------------------------------------------
// Animation
// ----------------------------------------------------

let start = performance.now();

function animate(now) {

    let t =
        (now - start) / 1000;

    render(t);

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

</script>

</body>
</html>
